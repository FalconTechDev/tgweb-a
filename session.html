<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>session</title>
</head>
<body>
<script>
// Injects a Telegram auth key (hex, 256 bytes) into tgweb's localStorage
// session slot, then reloads into the app already logged in.
// Usage: session.html#dc=2&key=<512 hex chars>
(function () {
  var h = location.hash ? location.hash.replace(/^#/, '') : location.search.replace(/^\?/, '');
  var p = new URLSearchParams(h);
  var dc = parseInt(p.get('dc') || '0', 10);
  var key = (p.get('key') || '').trim().toLowerCase();
  if (!dc || key.length !== 512 || !/^[0-9a-f]+$/.test(key)) {
    document.body.textContent = 'bad params: need #dc=<n>&key=<512 hex>\n' +
      'href=' + location.href + '\nsearch=' + location.search + '\nhash=' + location.hash;
    return;
  }
  var slot = {
    dcId: dc,
    authKeyCreatedAt: {},
    date: Date.now()
  };
  slot['dc' + dc + '_auth_key'] = key;
  try {
    localStorage.setItem('account1', JSON.stringify(slot));
    localStorage.setItem('dc', String(dc));
    localStorage.setItem('dc' + dc + '_auth_key', JSON.stringify(key));
  } catch (e) {
    document.body.textContent = 'storage failed: ' + e;
    return;
  }
  location.replace('./');
})();
</script>
</body>
</html>
