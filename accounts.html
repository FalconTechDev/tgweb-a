<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TG Web</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,#0e1621 0%,#17212b 100%);
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Roboto','Segoe UI',sans-serif;
  padding:32px 16px calc(32px + env(safe-area-inset-bottom));
}
.header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.header .logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#4a9eff,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:22px}
.header h1{font-size:20px;font-weight:600;margin:0}
.header span{display:block;font-size:13px;color:#7d8b99;font-weight:400}
.card{
  display:flex;align-items:center;gap:14px;width:100%;max-width:400px;
  padding:14px;margin-bottom:10px;border:0;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  color:#fff;text-align:left;font-family:inherit;
  transition:transform .12s ease,background .12s ease;
}
.card:active{transform:scale(.98);background:rgba(74,158,255,.15)}
.avatar{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:#fff;
}
.info{flex:1;min-width:0}
.name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:#7d8b99;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc{font-size:11px;color:#5eb5f7;background:rgba(94,181,247,.12);border-radius:20px;padding:3px 8px;flex-shrink:0}
.footer{margin-top:auto;padding-top:24px;font-size:12px;color:#54636f}
</style>
</head>
<body>
<div class="header">
  <div class="logo">✈</div>
  <div><h1>TG Web</h1><span>выбери аккаунт</span></div>
</div>
<div id="list"></div>
<div class="footer">сессия не покидает это устройство</div>
<script>

var PALETTE = [
  ['#e17076','#f2933f'],['#56b4d3','#4a9eff'],['#7c5cff','#4a9eff'],
  ['#6dd5a5','#3aa0ff'],['#f7b733','#fc4a1a'],['#a18cd1','#fbc2eb']
];
var list = document.getElementById('list');
ACCOUNTS.forEach(function(a, i){
  var b = document.createElement('button');
  b.className = 'card';
  var g = PALETTE[i % PALETTE.length];
  b.innerHTML =
    '<div class="avatar" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')">'+a.initials+'</div>'+
    '<div class="info"><div class="name"></div><div class="sub"></div></div>'+
    '<div class="dc">DC'+a.dc+'</div>';
  b.querySelector('.name').textContent = a.name;
  b.querySelector('.sub').textContent = '@'+a.username+' · '+a.uid;
  b.onclick = function(){
    try{localStorage.clear();}catch(e){}
    var slot = {dcId: a.dc, authKeyCreatedAt: {}, date: Date.now()};
    Object.keys(a.keys).forEach(function(n){ slot['dc'+n+'_auth_key'] = a.keys[n]; });
    try{
      localStorage.setItem('account1', JSON.stringify(slot));
      localStorage.setItem('dc', String(a.dc));
      Object.keys(a.keys).forEach(function(n){
        localStorage.setItem('dc'+n+'_auth_key', JSON.stringify(a.keys[n]));
      });
    }catch(e){ alert('storage failed: '+e); return; }
    location.replace('./?r=' + Date.now());
  };
  list.appendChild(b);
});
</script>
</body>
</html>
